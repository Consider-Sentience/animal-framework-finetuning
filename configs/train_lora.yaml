# LoRA training hyperparameters. These match the constants in scripts/training/train_hm7b.py and train_cai.py.

base_model: mistralai/Mistral-7B-v0.1

# HM7B (Helpful Mistral 7B) — Alpaca SFT foundation that every model stacks on.
hm7b:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.1
  target_modules: [q_proj, v_proj]
  epochs: 3
  learning_rate: 2.0e-4
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  precision: bf16

# Constitutional adapters (one per constitution and training set).
# Identical hyperparameters across all six constitutions; only the constitution
# used to build the training data varies.
cai_narrow:
  r: 64
  lora_alpha: 128
  lora_dropout: 0.1
  target_modules: [q_proj, v_proj]
  epochs: 3
  learning_rate: 2.0e-4
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  precision: bf16
  gradient_checkpointing: true
